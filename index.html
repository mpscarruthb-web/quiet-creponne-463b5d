<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    const PROJECTS = [
        { id: 1, name: "Operations Building" },
        { id: 2, name: "New Practice Field" },
        { id: 3, name: "Enclose Existing Practice Field" },
        { id: 4, name: "Mustang Elementary - Interior Refresh" },
        { id: 5, name: "Band Orchestra" },
        { id: 6, name: "Lakehoma Elementary - Interior Refresh" },
        { id: 7, name: "New Track Complex" },
        { id: 8, name: "Mustang Valley Elementary - Interior Refresh" },
        { id: 9, name: "Multi-Sport Facility" },
        { id: 10, name: "Remodel Fieldhouse" }
    ];

    let db = null;
    let auth = null;
    let currentUser = null;
    let allResponses = [];

    const firebaseConfig = {
        apiKey: "AIzaSyAXYs3NYjzazYp7o0PF722DnF9tSvM0M_I",
        authDomain: "mps-bond-voting.firebaseapp.com",
        projectId: "mps-bond-voting",
        storageBucket: "mps-bond-voting.firebasestorage.app",
        messagingSenderId: "591807456200",
        appId: "1:591807456200:web:a407a03296d76da6a196fd",
        databaseURL: "https://mps-bond-voting-default-rtdb.firebaseio.com"
    };

    async function initBackend() {
        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getDatabase(app);

            await signInAnonymously(auth);

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) {
                    subscribeToData();
                }
            });
        } catch (err) {
            console.warn("Offline/local mode:", err);
            setupLocalFallback();
        }
    }

    function setupLocalFallback() {
        const stored = localStorage.getItem('mps_bond_votes');
        allResponses = stored ? JSON.parse(stored) : [];
        updateDashboardUI();
    }

    function subscribeToData() {
        if (!db) return;
        const votesRef = ref(db, 'votes');
        
        onValue(votesRef, (snapshot) => {
            allResponses = [];
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(key => {
                    allResponses.push({ id: key, ...data[key] });
                });
            }
            updateDashboardUI();
        });
    }

    window.onload = function() {
        document.getElementById('voter-date').value = new Date().toISOString().split('T')[0];
        
        // Check if user has already voted on this device
        checkIfAlreadyVoted();

        renderVotingForm();
        renderDashboardGrid();
        initBackend();
    };

    function checkIfAlreadyVoted() {
        if (localStorage.getItem('mps_bond_voted_status') === 'completed') {
            const submitBtn = document.getElementById('submit-btn');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = `<i class="ph-bold ph-lock-key"></i> <span>Ballot Already Submitted</span>`;
                submitBtn.className = "w-full sm:w-auto px-8 py-3.5 bg-slate-600 text-white font-bold rounded-xl cursor-not-allowed";
            }
        }
    }

    function renderVotingForm() {
        const container = document.getElementById('projects-container');
        container.innerHTML = PROJECTS.map(project => `
            <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm hover:shadow-md transition space-y-4">
                <div class="flex items-start justify-between">
                    <h3 class="font-display font-extrabold text-base text-slate-900 leading-snug">
                        <span class="text-mustang-red font-black mr-1">${project.id}.</span> ${project.name}
                    </h3>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="proj_${project.id}_vote" value="Yes" onchange="updateVoteCounter()" class="peer sr-only">
                        <div class="py-2.5 px-3 rounded-xl border border-slate-200 text-center font-bold text-xs sm:text-sm text-slate-700 peer-checked:bg-mustang-red peer-checked:text-white peer-checked:border-mustang-red peer-checked:shadow transition flex items-center justify-center space-x-1.5">
                            <i class="ph-bold ph-thumbs-up text-base"></i>
                            <span>Yes</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="proj_${project.id}_vote" value="Need More Information" onchange="updateVoteCounter()" class="peer sr-only">
                        <div class="py-2.5 px-3 rounded-xl border border-slate-200 text-center font-bold text-xs sm:text-sm text-slate-700 peer-checked:bg-slate-700 peer-checked:text-white peer-checked:border-slate-700 peer-checked:shadow transition flex items-center justify-center space-x-1.5">
                            <i class="ph-bold ph-question text-base"></i>
                            <span>Need Info</span>
                        </div>
                    </label>
                </div>

                <div>
                    <input type="text" name="proj_${project.id}_comment" placeholder="Add optional feedback for ${project.name}..." class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-mustang-red text-xs sm:text-sm outline-none transition placeholder:text-slate-400">
                </div>
            </div>
        `).join('');
    }

    function renderDashboardGrid() {
        const grid = document.getElementById('dashboard-grid');
        grid.innerHTML = PROJECTS.map(project => `
            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex flex-col h-[420px]">
                <div class="pb-3 border-b border-slate-100 min-h-[50px] flex items-center">
                    <h4 class="font-display font-extrabold text-xs sm:text-sm text-slate-900 leading-tight">
                        <span class="text-mustang-red font-black">${project.id}.</span> ${project.name}
                    </h4>
                </div>

                <div class="py-4 flex-1 flex flex-col justify-end space-y-2">
                    <div class="flex justify-between items-baseline text-xs font-black px-1">
                        <div class="text-mustang-red"><span id="dash-${project.id}-yes-pct">0%</span> Yes</div>
                        <div class="text-slate-600"><span id="dash-${project.id}-info-pct">0%</span> Need Info</div>
                    </div>

                    <div class="h-32 bg-slate-50 rounded-xl p-2 flex items-end justify-around space-x-3 border border-slate-100">
                        <div class="w-1/2 flex flex-col items-center h-full justify-end">
                            <span id="dash-${project.id}-yes-count" class="text-[10px] font-bold text-slate-500 mb-1">0</span>
                            <div id="dash-${project.id}-yes-bar" class="w-full bg-mustang-red rounded-t-lg transition-all duration-500 min-h-[4px]" style="height: 0%"></div>
                            <span class="text-[9px] font-bold uppercase text-slate-400 mt-1">YES</span>
                        </div>
                        <div class="w-1/2 flex flex-col items-center h-full justify-end">
                            <span id="dash-${project.id}-info-count" class="text-[10px] font-bold text-slate-500 mb-1">0</span>
                            <div id="dash-${project.id}-info-bar" class="w-full bg-slate-700 rounded-t-lg transition-all duration-500 min-h-[4px]" style="height: 0%"></div>
                            <span class="text-[9px] font-bold uppercase text-slate-400 mt-1">INFO</span>
                        </div>
                    </div>
                </div>

                <div class="pt-3 border-t border-slate-100 flex-1 flex flex-col overflow-hidden">
                    <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5 flex items-center justify-between">
                        <span>Comments Feed</span>
                        <span id="dash-${project.id}-comment-count" class="text-slate-500 font-medium">(0)</span>
                    </div>
                    <div id="dash-${project.id}-comments-list" class="flex-1 overflow-y-auto custom-scrollbar space-y-1.5 pr-1 text-xs text-slate-600">
                        <p class="text-[11px] text-slate-400 italic">No comments yet.</p>
                    </div>
                </div>
            </div>
        `).join('');
    }

    window.updateVoteCounter = function() {
        let count = 0;
        PROJECTS.forEach(p => {
            const selected = document.querySelector(`input[name="proj_${p.id}_vote"]:checked`);
            if (selected) count++;
        });
        document.getElementById('voted-count-badge').textContent = `${count} / 10`;
    };

    window.handleFormSubmit = async function(e) {
        e.preventDefault();
        
        // Guard 1: Double voting check
        if (localStorage.getItem('mps_bond_voted_status') === 'completed') {
            showToast("You have already cast a vote from this device.");
            return;
        }

        const voterName = document.getElementById('voter-name').value.trim();
        
        // Guard 2: Require Voter Name
        if (!voterName) {
            showToast("Please enter your name at the top of the form before submitting.");
            document.getElementById('voter-name').focus();
            return;
        }

        const dateStr = document.getElementById('voter-date').value;
        const votes = {};
        const comments = {};
        let hasAtLeastOne = false;

        PROJECTS.forEach(p => {
            const voteElem = document.querySelector(`input[name="proj_${p.id}_vote"]:checked`);
            const commentElem = document.querySelector(`input[name="proj_${p.id}_comment"]`);
            
            votes[p.id] = voteElem ? voteElem.value : 'Unvoted';
            comments[p.id] = commentElem ? commentElem.value.trim() : '';

            if (voteElem) hasAtLeastOne = true;
        });

        if (!hasAtLeastOne) {
            showToast("Please make at least one project selection before submitting.");
            return;
        }

        const payload = {
            voterName,
            date: dateStr,
            timestamp: Date.now(),
            votes,
            comments
        };

        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;

        try {
            if (db) {
                await push(ref(db, 'votes'), payload);
            }
            
            // Mark device as voted
            localStorage.setItem('mps_bond_voted_status', 'completed');
            checkIfAlreadyVoted();

            document.getElementById('modal-success').classList.remove('hidden');
        } catch (err) {
            console.error("Submission failed:", err);
            showToast("Error submitting ballot. Please try again.");
            submitBtn.disabled = false;
        }
    };

    function updateDashboardUI() {
        const totalVoters = allResponses.length;
        document.getElementById('metric-total-voters').textContent = totalVoters.toLocaleString();

        let totalYesAllProjects = 0;
        let totalVotesAllProjects = 0;
        const projectSupportMap = {};

        PROJECTS.forEach(p => {
            let yesCount = 0;
            let infoCount = 0;
            const projectComments = [];

            allResponses.forEach(resp => {
                const vote = resp.votes ? resp.votes[p.id] : null;
                if (vote === 'Yes') yesCount++;
                if (vote === 'Need More Information') infoCount++;

                const comment = resp.comments ? resp.comments[p.id] : null;
                if (comment) {
                    projectComments.push({
                        name: resp.voterName || 'Anonymous',
                        text: comment
                    });
                }
            });

            const totalValid = yesCount + infoCount;
            const yesPct = totalValid > 0 ? Math.round((yesCount / totalValid) * 100) : 0;
            const infoPct = totalValid > 0 ? Math.round((infoCount / totalValid) * 100) : 0;

            projectSupportMap[p.id] = yesPct;
            totalYesAllProjects += yesCount;
            totalVotesAllProjects += totalValid;

            document.getElementById(`dash-${p.id}-yes-pct`).textContent = `${yesPct}%`;
            document.getElementById(`dash-${p.id}-info-pct`).textContent = `${infoPct}%`;
            
            document.getElementById(`dash-${p.id}-yes-count`).textContent = yesCount;
            document.getElementById(`dash-${p.id}-info-count`).textContent = infoCount;

            document.getElementById(`dash-${p.id}-yes-bar`).style.height = `${yesPct}%`;
            document.getElementById(`dash-${p.id}-info-bar`).style.height = `${infoPct}%`;

            const commentListElem = document.getElementById(`dash-${p.id}-comments-list`);
            document.getElementById(`dash-${p.id}-comment-count`).textContent = `(${projectComments.length})`;

            if (projectComments.length > 0) {
                commentListElem.innerHTML = projectComments.map(c => `
                    <div class="bg-slate-50 p-2 rounded-lg border border-slate-100">
                        <span class="font-bold text-slate-800 text-[10px] block">${escapeHtml(c.name)}</span>
                        <span class="text-slate-600 block">${escapeHtml(c.text)}</span>
                    </div>
                `).join('');
            } else {
                commentListElem.innerHTML = `<p class="text-[11px] text-slate-400 italic">No comments yet.</p>`;
            }
        });

        const overallRate = totalVotesAllProjects > 0 ? Math.round((totalYesAllProjects / totalVotesAllProjects) * 100) : 0;
        document.getElementById('metric-overall-support').textContent = `${overallRate}%`;

        let topProjId = 1;
        let topProjPct = -1;
        PROJECTS.forEach(p => {
            if (projectSupportMap[p.id] > topProjPct) {
                topProjPct = projectSupportMap[p.id];
                topProjId = p.id;
            }
        });

        const topProj = PROJECTS.find(p => p.id === topProjId);
        document.getElementById('metric-top-project').textContent = totalVoters > 0 
            ? `${topProj.id}. ${topProj.name} (${topProjPct}%)` 
            : 'N/A';
    }

    window.switchTab = function(tab) {
        const formView = document.getElementById('view-form');
        const dashView = document.getElementById('view-dashboard');
        const btnForm = document.getElementById('btn-tab-form');
        const btnDash = document.getElementById('btn-tab-dashboard');

        if (tab === 'form') {
            formView.classList.remove('hidden');
            dashView.classList.add('hidden');
            btnForm.className = "flex items-center space-x-2 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all bg-mustang-red text-white shadow";
            btnDash.className = "flex items-center space-x-2 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all text-slate-300 hover:text-white";
        } else {
            formView.classList.add('hidden');
            dashView.classList.remove('hidden');
            btnDash.className = "flex items-center space-x-2 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all bg-mustang-red text-white shadow";
            btnForm.className = "flex items-center space-x-2 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all text-slate-300 hover:text-white";
            updateDashboardUI();
        }
    };

    window.closeSuccessModal = function() {
        document.getElementById('modal-success').classList.add('hidden');
    };

    window.showQRCodeModal = function() {
        const currentUrl = window.location.href;
        const qrImg = document.getElementById('qr-code-img');
        const qrText = document.getElementById('qr-url-text');
        
        qrImg.src = `https://quickchart.io/qr?text=${encodeURIComponent(currentUrl)}&size=300&margin=1`;
        qrText.textContent = currentUrl;
        
        document.getElementById('modal-qrcode').classList.remove('hidden');
    };

    window.closeQRCodeModal = function() {
        document.getElementById('modal-qrcode').classList.add('hidden');
    };

    window.resetForm = function() {
        document.getElementById('bond-form').reset();
        document.getElementById('voter-date').value = new Date().toISOString().split('T')[0];
        updateVoteCounter();
    };

    window.exportToCSV = function() {
        if (allResponses.length === 0) {
            showToast("No response data available to export.");
            return;
        }

        let csv = "Voter Name,Date,Timestamp,";
        PROJECTS.forEach(p => {
            csv += `"${p.id}. ${p.name} - Selection","${p.id}. ${p.name} - Comments",`;
        });
        csv = csv.slice(0, -1) + "\n";

        allResponses.forEach(r => {
            const dateVal = r.date || '';
            const timeVal = r.timestamp ? new Date(r.timestamp).toLocaleString() : '';
            csv += `"${escapeCsv(r.voterName)}","${escapeCsv(dateVal)}","${escapeCsv(timeVal)}",`;

            PROJECTS.forEach(p => {
                const vote = r.votes ? r.votes[p.id] || '' : '';
                const comment = r.comments ? r.comments[p.id] || '' : '';
                csv += `"${escapeCsv(vote)}","${escapeCsv(comment)}",`;
            });
            csv = csv.slice(0, -1) + "\n";
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `2027_MPS_Bond_Voting_Results_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };

    window.clearAllData = async function() {
        if (db) {
            try {
                await remove(ref(db, 'votes'));
            } catch (e) {
                console.error("Error clearing database:", e);
            }
        }
        localStorage.removeItem('mps_bond_voted_status');
        allResponses = [];
        updateDashboardUI();
        showToast("Database and vote restrictions reset.");
    };

    function showToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toast-msg').textContent = msg;
        toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
        setTimeout(() => {
            toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
        }, 3000);
    }

    function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeCsv(str) {
        return String(str).replace(/"/g, '""');
    }
</script>
